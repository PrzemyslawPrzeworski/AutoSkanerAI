llm.openrouter.base-url=https://openrouter.ai/api/v1
llm.openrouter.api-key=${OPENROUTER_API_KEY}
# Free tier, ~6 s for a listing analysis, follows the JSON-only instruction in Polish.
# Verified 2026-08-26 by OpenRouterLiveTest. The previous default,
# meta-llama/llama-3.3-70b-instruct:free, was withdrawn from the free tier and now 404s.
# OpenRouter retires ":free" slugs without notice — if this starts returning 404, re-run
# OpenRouterLiveTest against a current slug rather than assuming a transport fault.
# Rejected alternatives: nvidia/nemotron-3-super-120b-a12b:free (works, 58 s — too slow on
# the request thread), google/gemma-4-31b-it:free (429 from a shared upstream pool).
llm.openrouter.model=${OPENROUTER_MODEL:z-ai/glm-5.2:free}
