llm.openrouter.base-url=https://openrouter.ai/api/v1
llm.openrouter.api-key=${OPENROUTER_API_KEY}
# Free tier, ~8 s for a listing analysis, follows the JSON-only instruction in Polish.
# Verified 2026-08-26 by OpenRouterLiveTest and live against production.
#
# ":free" slugs are NOT production-grade. They run on shared upstream pools and 429 with no
# warning: meta-llama/llama-3.3-70b-instruct:free (the original default) was withdrawn from
# the free tier entirely and 404s, and z-ai/glm-5.2:free went from passing locally to
# globally rate-limited inside fifteen minutes on 2026-08-26, taking every production
# analysis to 502. A 404 here means "slug retired"; a 429 means "shared pool saturated".
# Neither is a transport fault and neither is fixed by retrying.
#
# The durable fix is credits on the OpenRouter key plus a paid slug. Until then, when this
# model starts 429ing, probe candidates with OpenRouterLiveTest and swap the slug.
# Checked 2026-08-26: dots-studio/dots-3-note-preview:free (read timeout at 63 s),
# nvidia/nemotron-3-super-120b-a12b:free (passes but 58 s — too slow on the request thread),
# google/gemma-4-31b-it:free and google/gemma-4-26b-a4b-it:free (429, Google AI Studio pool).
llm.openrouter.model=${OPENROUTER_MODEL:minimax/minimax-m3:free}
