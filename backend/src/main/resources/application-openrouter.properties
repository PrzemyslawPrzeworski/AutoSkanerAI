llm.openrouter.base-url=https://openrouter.ai/api/v1
llm.openrouter.api-key=${OPENROUTER_API_KEY}
# Free tier, 10.8-16.7 s for a listing analysis, follows the JSON-only instruction in Polish and
# obeys the accident rule. Verified 2026-09-11 (see "How a candidate is verified" below).
#
# ":free" slugs are NOT production-grade, and they fail in THREE distinct ways. The first two are
# per-slug and a swap fixes them; the third is not, and mistaking it for the others wastes an
# afternoon:
#   404 - slug retired. meta-llama/llama-3.3-70b-instruct:free (the original default) was withdrawn
#         from the free tier entirely.
#   429 "Provider returned error" - the shared upstream pool is saturated. z-ai/glm-5.2:free went
#         from passing locally to globally rate-limited inside fifteen minutes on 2026-08-26,
#         taking every production analysis to 502.
#   429 "Rate limit exceeded: free-models-per-day" - the ACCOUNT's daily allowance is spent. This
#         is not about the model: on 2026-09-10 all nineteen candidates probed returned it, which
#         reads exactly like "every free model is down" and is not. It resets at 00:00 UTC, not at
#         local midnight (CEDT is UTC+2, so a local date rollover is two hours early - checked, and
#         it re-429s if you believe the local clock). Adding 10 credits to the key lifts the cap to
#         1000 free requests/day; that is a ONE-TIME top-up, not a subscription, and ":free" slugs
#         still bill nothing per call.
# None of the three is a transport fault and none is fixed by retrying.
#
# How a candidate is verified. OpenRouterLiveTest is the gate and stays the gate, but it CANNOT run
# on the current dev machine: Zscaler re-signs TLS and its CA is not in the JDK truststore, so every
# Java HTTPS call to openrouter.ai dies with "PKIX path building failed" before the model is ever
# reached. curl and node use the OS store and succeed, so candidates were screened through
# backend/target/or-verify.mjs, which extracts AnalysisPrompt's text block from the .java source
# (not a transcription - a slip there would judge models against a prompt we never send) and checks
# what the parser demands plus the rule the root CLAUDE.md fixes: two listings, one declaring
# "bezwypadkowy" (accidentClaim must be quoted) and one silent on accidents (accidentClaim MUST be
# null AND riskFlags MUST carry NO_ACCIDENT_DECLARATION). A model that fabricates the declaration is
# rejected however fast it is. Run OpenRouterLiveTest wherever the truststore allows it.
#
# Two traps that made earlier screens wrong. A short toy prompt understates latency by 6-9x - this
# 5.5 KB system prompt turned a "2.0 s" slug into 18.5 s - so only measure with the real prompt. And
# max_tokens must be generous (2000+): a reasoning model given 300 spends the budget thinking and
# returns empty content, which reads as "broken model" rather than "unfair probe".
#
# Checked 2026-09-11 against the real prompt, 4 calls each: inclusionai/ling-3.0-flash-vl:free 8/8
# (chosen), nex-agi/nex-n2.5-mini:free 5/8 (empty content), poolside/laguna-xs-2.1:free 2/8 (pool
# 429s), cohere/north-mini-code:free and nex-agi/nex-n2.5-pro:free (empty content),
# thinkingmachines/inkling{,-small}:free (403, agentic harnesses only),
# nvidia/nemotron-3.5-content-safety:free (a classifier, not a generator),
# nvidia/nemotron-3.5-lightning:free (no answer in 45 s). The slugs this replaces both failed in
# production on 2026-09-10: minimax/minimax-m3:free and z-ai/glm-5.2:free were walked past and the
# analysis was served by fallback 2 at 30 s.
llm.openrouter.model=${OPENROUTER_MODEL:inclusionai/ling-3.0-flash-vl:free}

# Tried in order when the primary is rate-limited, retired, or unreachable. nex-n2.5-mini is flaky
# on the schema (5 of 8) but a flaky fallback still beats a 502, and its failure is fast. nemotron
# sits last because it is the slowest thing here (40-44 s with this prompt, not the 58 s measured in
# August) and because it is the one slug production has actually served an analysis from, which
# makes it the right last resort and the wrong primary.
llm.openrouter.fallback-models=${OPENROUTER_FALLBACK_MODELS:nex-agi/nex-n2.5-mini:free,nvidia/nemotron-3-super-120b-a12b:free}

# Wall-clock budget for the whole chain. Checked only between models, so the primary is always
# attempted; this caps how far the fallback walks rather than aborting a request mid-flight.
# 70 s fits the measured worst case: 17 s primary + 31 s fallback 1 leaves nemotron unreachable on
# a bad day, which is deliberate - a user waiting past a minute is better served by an error.
llm.openrouter.deadline-seconds=${OPENROUTER_DEADLINE_SECONDS:70}
