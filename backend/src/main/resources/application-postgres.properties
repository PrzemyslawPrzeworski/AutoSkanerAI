# Real PostgreSQL. Composes with an LLM profile rather than replacing it:
#
#   SPRING_PROFILES_ACTIVE=openrouter,postgres
#
# Why a profile and not a `${DATABASE_URL:<h2 default>}` in application.properties, which would be
# the shorter spelling: Render still carries DATABASE_URL / DATABASE_USERNAME / DATABASE_PASSWORD
# pointing at db.bahoxzvhamktpepmkaft.supabase.co, and that Supabase project no longer exists — the
# host does not resolve at all (ENOTFOUND), so it was deleted, not paused. Flyway needs a connection
# before the application context finishes starting, so a default that read DATABASE_URL would have
# turned three stale variables into a failing deploy the moment F-02 shipped. Variables that look
# configured and are dead must not sit on the boot path. Activating this profile is the explicit
# statement that a database exists.
#
# None of the three has a default, on purpose and for the same reason `llm.openrouter.api-key` has
# none: a profile that says "use Postgres" and then quietly falls back to an in-memory database
# would lose a user's saved analyses without ever failing.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
