# The offline, no-credentials profile: `mock` is what `./mvnw test`, the git hooks, the Playwright
# specs and a bare `./mvnw spring-boot:run` all use, and none of them has a secret to supply.
#
# This file exists so `auth.jwt.secret` -- which has NO default in application.properties on purpose,
# because a committed signing key in a public repository is a key anyone can mint tokens with -- is
# still resolvable here. The value below is a development constant in the same spirit as the
# synthetic VIN in MockCepikService: safe precisely because it is public and because this profile
# never runs in production, which activates `openrouter,postgres`.
#
# If you ever see this profile active on a deployed instance, that is the incident.
auth.jwt.secret=mock-profile-development-signing-key-not-for-production-use
