spring.application.name=autoskaner-ai
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mock}
server.port=${PORT:10000}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
frontend.url=${FRONTEND_URL:https://autoskaner-ai.pages.dev}

# --- Persistence (F-02) ---
# The default datasource is an in-memory H2 in PostgreSQL compatibility mode, so `./mvnw test`,
# `./mvnw spring-boot:run` and the deployed container all boot with no database to provision. The
# compatibility mode is what lets ONE Flyway migration set serve both engines: without it H2 rejects
# `TIMESTAMP WITH TIME ZONE` defaults and identity syntax the Postgres migration needs, and the
# alternative is vendor-specific migration directories that drift.
#
# Real Postgres arrives by activating the `postgres` profile, NOT by setting DATABASE_URL here.
# See application-postgres.properties for why that distinction is load-bearing.
spring.datasource.url=jdbc:h2:mem:autoskaner;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# Render's free tier and Supabase's pooler both cap connections far below Hikari's default of 10.
spring.datasource.hikari.maximum-pool-size=5

# Flyway owns the schema. Hibernate is allowed to CHECK that the entities match it and nothing more:
# `validate` fails startup on drift, where `update` would silently patch the live schema and leave
# the migration — the thing a new environment replays — wrong. A drifted column therefore fails in
# the commit gate, which runs H2. It can still fail first on Postgres if a type differs between the
# two dialects; that surfaces as a failed Render deploy, which keeps serving the previous version.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Auth (F-03) ---
# NO DEFAULT, deliberately: an unset AUTH_JWT_SECRET must fail context startup rather than fall back
# to a value. This repository is public, so a committed default is a signing key anyone can use to
# mint a token for any account -- the failure mode is not "auth is misconfigured", it is "auth is
# decoration". Same rule as OPENROUTER_API_KEY and the postgres datasource.
#
# application-mock.properties overrides it with a fixed development key, because `mock` is the
# offline no-credentials profile the git hooks and the E2E specs run. Production activates
# `openrouter,postgres` and so must supply the variable.
#
# Must be at least 32 bytes -- HS256 needs a 256-bit key and JwtConfig says so with a readable
# message rather than letting Nimbus throw about key lengths.
auth.jwt.secret=${AUTH_JWT_SECRET}
# 15 minutes, because the access token is the part an XSS can read out of memory; the refresh token
# is the part stored in localStorage and it buys a fortnight of not retyping a password. Neither can
# be revoked -- see context/changes/auth-scaffold/change.md, "Left undone".
auth.jwt.access-token-ttl=15m
auth.jwt.refresh-token-ttl=14d
