spring.application.name=autoskaner-ai
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mock}
server.port=${PORT:10000}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
frontend.url=${FRONTEND_URL:https://autoskaner-ai.pages.dev}

# --- Persistence (F-02) ---
# The default datasource is an in-memory H2 in PostgreSQL compatibility mode, so `./mvnw test`,
# `./mvnw spring-boot:run` and the deployed container all boot with no database to provision. The
# compatibility mode is what lets ONE Flyway migration set serve both engines: without it H2 rejects
# `TIMESTAMP WITH TIME ZONE` defaults and identity syntax the Postgres migration needs, and the
# alternative is vendor-specific migration directories that drift.
#
# Real Postgres arrives by activating the `postgres` profile, NOT by setting DATABASE_URL here.
# See application-postgres.properties for why that distinction is load-bearing.
spring.datasource.url=jdbc:h2:mem:autoskaner;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# Render's free tier and Supabase's pooler both cap connections far below Hikari's default of 10.
spring.datasource.hikari.maximum-pool-size=5

# Flyway owns the schema. Hibernate is allowed to CHECK that the entities match it and nothing more:
# `validate` fails startup on drift, where `update` would silently patch the live schema and leave
# the migration — the thing a new environment replays — wrong. A drifted column therefore fails in
# the commit gate, which runs H2. It can still fail first on Postgres if a type differs between the
# two dialects; that surfaces as a failed Render deploy, which keeps serving the previous version.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
