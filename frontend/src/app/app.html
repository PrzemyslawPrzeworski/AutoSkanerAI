<header class="app-header">
  <span class="app-title">AutoSkanerAI</span>
  @if (auth.isAuthenticated()) {
    <div class="app-account">
      <span class="app-email">{{ auth.email() }}</span>
      <!-- Deliberately not a `pButton`. The shell is the only eager component in the app, so one
        PrimeNG component here hoists PrimeNG's shared base out of the lazy analyzer chunk and into
        the initial bundle: measured 433.50 kB → 526.39 kB for exactly this button. -->
      <button class="app-logout" type="button" (click)="logout()">Wyloguj</button>
    </div>
  }
</header>
<main class="app-main">
  <router-outlet />
</main>
